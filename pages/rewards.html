<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoga Mastery - Your Rewards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; color: #166534; }

/* Sidebar */
.sidebar {
    width: 280px;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    background: white;
    border-right: 1px solid #dcfce7;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 50;
}

/* Desktop sidebar always visible */
@media (min-width: 1024px) {
    .sidebar {
        transform: translateX(0);
    }
}

/* Overlay */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    visibility: hidden;
    transition: 0.3s;
    z-index: 40;
}
.overlay.show {
    opacity: 1;
    visibility: visible;
}

/* Main */
.main-content {
    margin-left: 0;
    padding: 24px;
    transition: margin-left 0.3s;
}
@media (min-width: 1024px) {
    .main-content {
        margin-left: 280px;
        padding: 40px;
    }
}

.nav-item {
    display: flex;
    align-items: center;
    padding: 12px 24px;
    margin: 4px 16px;
    border-radius: 12px;
    font-weight: 600;
    color: #4b5563;
}
.nav-item:hover { background:#f0fdf4; color:#166534; }
.nav-item.active { background:#dcfce7; color:#15803d; }

/* Cards */
.reward-card { border:1px solid #dcfce7; background:white; transition:0.3s; }
.reward-card.unlocked:hover { transform: scale(1.05); }

.locked-badge { filter: grayscale(1); opacity: 0.5; position: relative; }
.lock-icon {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<!-- Toggle -->
<button id="menu-btn" class="lg:hidden fixed top-4 left-4 z-50 bg-green-600 text-white px-4 py-2 rounded-md">
☰ Menu
</button>

<!-- Sidebar -->
<aside id="sidebar" class="sidebar">
    <div class="p-8">
        <h1 class="text-2xl font-black text-green-800">Y-FLEX MO</h1>
    </div>

    <nav class="flex-grow">
        <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
        <a href="challenges_list.html" class="nav-item">📜 Challenges</a>
        <a href="myprogress.html" class="nav-item">📊 My Progress</a>
        <a href="rewards.html" class="nav-item active">🏆 Rewards</a>
    </nav>

    <div class="p-6 border-t">
        <a href="#" class="nav-item text-red-500">🚪 Logout</a>
    </div>
</aside>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<!-- Main -->
<main class="main-content">

<header class="mb-10">
    <h1 class="text-3xl sm:text-4xl font-black text-green-900">Trophy Room</h1>
    <p class="text-green-700 mt-2">Your achievements and earned badges.</p>
</header>

<!-- Stats -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">

    <div class="bg-green-600 text-white p-6 rounded-3xl">
        <p class="text-xs uppercase">Current Balance</p>
        <h3 class="text-3xl font-black"><span id="points">0</span> YP</h3>
    </div>

    <div class="bg-white p-6 rounded-3xl border">
        <p class="text-xs text-gray-500 uppercase">Badges</p>
        <h3 class="text-3xl font-black text-green-800"><span id="badges">0</span>/3</h3>
    </div>

    <div class="bg-white p-6 rounded-3xl border">
        <p class="text-xs text-gray-500 uppercase">Rank</p>
        <h3 id="rank" class="text-3xl font-black text-orange-500">Novice</h3>
    </div>

</div>

<!-- Badges -->
<section class="mb-12">
<h2 class="text-xl font-black mb-6">🏅 Earned Badges</h2>

<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">

<div id="b1" class="reward-card locked-badge p-5 rounded-3xl text-center">
    <div class="text-4xl">📜</div>
    <p class="text-xs mt-2">Stage 1</p>
    <div class="lock-icon">🔒</div>
</div>

<div id="b2" class="reward-card locked-badge p-5 rounded-3xl text-center">
    <div class="text-4xl">🧘</div>
    <p class="text-xs mt-2">Stage 2</p>
    <div class="lock-icon">🔒</div>
</div>

<div id="b3" class="reward-card locked-badge p-5 rounded-3xl text-center">
    <div class="text-4xl">🏆</div>
    <p class="text-xs mt-2">Stage 3</p>
    <div class="lock-icon">🔒</div>
</div>

</div>
</section>

</main>

<script>
const sidebar = document.getElementById("sidebar");
const btn = document.getElementById("menu-btn");
const overlay = document.getElementById("overlay");

btn.onclick = () => {
    sidebar.style.transform = "translateX(0)";
    overlay.classList.add("show");
};

overlay.onclick = () => {
    sidebar.style.transform = "translateX(-100%)";
    overlay.classList.remove("show");
};

// Load Data
window.onload = () => {
    let p1 = +localStorage.getItem("challenge1_points") || 0;
    let p2 = +localStorage.getItem("challenge2_points") || 0;
    let p3 = +localStorage.getItem("challenge3_points") || 0;

    let total = p1+p2+p3;

    document.getElementById("points").innerText = total;

    let done1 = localStorage.getItem("challenge1_complete")==="true";
    let done2 = localStorage.getItem("challenge2_complete")==="true";
    let done3 = localStorage.getItem("challenge3_complete")==="true";

    let count = [done1,done2,done3].filter(Boolean).length;
    document.getElementById("badges").innerText = count;

    if(total>=800) document.getElementById("rank").innerText="Master";
    else if(total>=400) document.getElementById("rank").innerText="Intermediate";

    function unlock(id){
        let el=document.getElementById(id);
        el.classList.remove("locked-badge");
        el.querySelector(".lock-icon").style.display="none";
    }

    if(done1) unlock("b1");
    if(done2) unlock("b2");
    if(done3) unlock("b3");
};
</script>

</body>
</html>
