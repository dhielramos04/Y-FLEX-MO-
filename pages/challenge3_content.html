<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yoga Challenge</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: black;
}

/* CAMERA */
#video {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* GREEN FRAME */
.frame {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  bottom: 10px;
  border: 4px solid #00e676;
  border-radius: 25px;
  box-shadow: 0 0 25px #00e676;
  pointer-events: none;
}

/* TITLE */
.title {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 22px;
}

.title span {
  color: #00e676;
  font-weight: bold;
}

/* POSE NAME */
.pose {
  position: absolute;
  top: 70px;
  width: 100%;
  text-align: center;
  color: #a5d6a7;
  font-size: 24px;
  font-weight: bold;
}

/* COUNTDOWN */
.countdown {
  position: absolute;
  top: 130px;
  width: 100%;
  text-align: center;
  font-size: 80px;
  color: #ffeb3b;
  font-weight: bold;
  text-shadow: 0 0 20px rgba(255,255,255,0.7);
}

/* SIDE BUTTONS */
.side {
  position: absolute;
  right: 15px;
  top: 35%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* SCORE */
.score {
  background: black;
  color: #00e676;
  padding: 15px;
  border-radius: 50%;
  font-size: 20px;
  text-align: center;
  box-shadow: 0 0 10px #00e676;
}

/* LOGO BUTTON */
.logo-btn img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  box-shadow: 0 0 15px #00e676;
}

/* TROPHY */
.trophy {
  background: black;
  color: gold;
  padding: 15px;
  border-radius: 50%;
  font-size: 22px;
  text-align: center;
}

/* START BUTTON */
.start-btn {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(45deg, #00c853, #64dd17);
  padding: 20px 60px;
  border-radius: 40px;
  font-size: 24px;
  color: white;
  border: none;
  box-shadow: 0 0 25px #00e676;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<div class="frame"></div>

<div class="title">
  <span>AI Yoga</span> Pose Challenge
</div>

<div id="poseName" class="pose">Ready</div>
<div id="countdown" class="countdown"></div>

<div class="side">
  <div id="scoreDisplay" class="score">0</div>

  <!-- YOUR LOGO HERE -->
  <div class="logo-btn">
   <img src="assets/images/yflexmo-logo.png">
  </div>

  <div class="trophy">🏆</div>
</div>

<button id="startBtn" class="start-btn">START</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
let video = document.getElementById("video");
let poseName = document.getElementById("poseName");
let countdownDisplay = document.getElementById("countdown");
let scoreDisplay = document.getElementById("scoreDisplay");
let startBtn = document.getElementById("startBtn");

let poses = [
  {name: "Mountain Pose"},
  {name: "Tree Pose"},
  {name: "Warrior I"},
  {name: "Warrior II"}
];

let index = 0;
let scores = [];

startBtn.onclick = async () => {
  startBtn.style.display = "none";
  if (!video.srcObject) await startCamera();
  startPose();
};

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });
    video.srcObject = stream;
  } catch {
    alert("Camera denied.");
  }
}

function startPose() {
  if (index >= poses.length) return finish();

  poseName.innerText = poses[index].name;

  let prep = 3;
  countdownDisplay.innerText = prep;

  let prepTimer = setInterval(() => {
    prep--;
    if (prep > 0) countdownDisplay.innerText = prep;
    else if (prep === 0) countdownDisplay.innerText = "GO!";
    else {
      clearInterval(prepTimer);
      holdPose();
    }
  }, 1000);
}

function holdPose() {
  let time = 5;
  let score = 60;

  let timer = setInterval(() => {
    time--;
    score += Math.random() * 5;
    if (score > 100) score = 100;

    countdownDisplay.innerText = time;
    scoreDisplay.innerText = Math.round(score);

    if (time <= 0) {
      clearInterval(timer);
      scores.push(score);
      index++;
      setTimeout(startPose, 1500);
    }
  }, 1000);
}

function finish() {
  let avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);

  poseName.innerText = "Completed!";
  countdownDisplay.innerText = avg;

  confetti();
}
</script>

</body>
</html>

</body>
</html>
