<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Yoga Pose Challenge</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  text-align: center;
}

.container {
  border: 3px solid #2e7d32;
  border-radius: 20px;
  padding: 20px;
  width: 95%;
  margin: auto;
}

h1 { color: #2e7d32; }

.game-area {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

video {
  width: 60%;
  max-width: 500px;
  border-radius: 15px;
  background: black;
}

button {
  background: #2e7d32;
  color: white;
  border: none;
  padding: 12px 25px;
  margin: 10px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #1b5e20;
}

#poseName {
  margin-top: 15px;
  font-size: 24px;
  color: #2e7d32;
}

#countdown {
  font-size: 40px;
  color: #ff5722;
  margin-top: 10px;
}

#score {
  font-size: 20px;
  color: #064e3b;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>AI Yoga Pose Challenge</h1>

  <div class="game-area">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <h2 id="poseName">Pose: -</h2>
  <h2 id="countdown"></h2>
  <h2 id="score">Score: -</h2>

  <button id="startBtn">Start Challenge</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
let video = document.getElementById("video");
let scoreDisplay = document.getElementById("score");
let poseName = document.getElementById("poseName");
let countdownDisplay = document.getElementById("countdown");
let startBtn = document.getElementById("startBtn");

let poses = [
  {name: "Mountain Pose"},
  {name: "Tree Pose"},
  {name: "Downward Facing Dog"},
  {name: "Warrior I"},
  {name: "Warrior II"}
];

let totalPoses = poses.length;
let currentPoseIndex = 0;
let countdown;
let timeLeft = 5;
let currentScore = 0;
let scores = [];

startBtn.addEventListener("click", async () => {
  startBtn.style.display = "none";
  if (!video.srcObject) {
    await startCamera();
  }
  startPose(currentPoseIndex);
});

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    video.srcObject = stream;
  } catch (err) {
    alert("Camera not supported or denied.");
  }
}

function startPose(index) {
  if (index >= totalPoses) {
    finishChallenge();
    return;
  }

  let selected = poses[index];
  poseName.innerText = `Pose ${index + 1}/${totalPoses}: ${selected.name}`;
  timeLeft = 5;
  currentScore = 60;
  countdownDisplay.innerText = "3";

  // 3-2-1 Countdown before GO
  let prepTime = 3;
  let prepCountdown = setInterval(() => {
    prepTime--;
    if (prepTime > 0) {
      countdownDisplay.innerText = prepTime;
    } else if (prepTime === 0) {
      countdownDisplay.innerText = "GO!";
    } else {
      clearInterval(prepCountdown);
      countdownDisplay.innerText = "";
      startHolding(index);
    }
  }, 1000);
}

function startHolding(index) {
  if (countdown) clearInterval(countdown);

  countdown = setInterval(() => {
    timeLeft--;
    currentScore += Math.random() * 6;
    if (currentScore > 100) currentScore = 100;

    scoreDisplay.innerText = `Hold: ${timeLeft}s | Score: ${Math.round(currentScore)}`;

    if (timeLeft <= 0) {
      clearInterval(countdown);
      scores.push(Math.round(currentScore));
      countdownDisplay.innerText = "Pose Complete!";
      scoreDisplay.innerText = `Pose Score: ${Math.round(currentScore)}`;

      // 3-second pause before next pose
      setTimeout(() => {
        currentPoseIndex++;
        startPose(currentPoseIndex);
      }, 3000);
    }
  }, 1000);
}

function finishChallenge() {
  let finalRawScore = Math.round(scores.reduce((a,b)=>a+b,0)/totalPoses);
  const stageWeight = 50;
  let weightedPoints = Math.round((finalRawScore / 100) * stageWeight);
  let stageNumber = 3;

  localStorage.setItem(`challenge${stageNumber}_score`, finalRawScore);
  localStorage.setItem(`challenge${stageNumber}_points`, weightedPoints);
  localStorage.setItem(`challenge${stageNumber}_complete`, 'true');

  let badgeTier = "Bronze";
  if (finalRawScore >= 90) badgeTier = "Gold";
  else if (finalRawScore >= 60) badgeTier = "Silver";
  localStorage.setItem(`challenge${stageNumber}_badge`, badgeTier);

  scoreDisplay.innerText = `Final Score: ${finalRawScore} | Points: ${weightedPoints}/${stageWeight} | Badge: ${badgeTier}`;

  confetti();

  setTimeout(() => {
    alert(`Challenge Completed!\nScore: ${finalRawScore}\nPoints Earned: ${weightedPoints}\nBadge: ${badgeTier}`);
    window.location.href = "dashboard.html";
  }, 3000);
}
</script>
</body>
</html>
</body>
</html>
