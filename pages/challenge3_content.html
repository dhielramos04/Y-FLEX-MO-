<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yoga Challenge</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: black;
}

/* CAMERA (NO COLOR OVERLAY) */
#video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* GREEN BORDER FRAME */
.camera-frame {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  bottom: 10px;
  border: 4px solid #00c853;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 255, 100, 0.6);
  pointer-events: none;
}

/* UI OVERLAY (TRANSPARENT) */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: white;
  padding: 20px;
}

/* TOP INFO */
.pose-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #a5d6a7;
}

.countdown {
  text-align: center;
  font-size: 50px;
  color: #ffeb3b;
}

/* SIDE BUTTONS */
.side-controls {
  position: absolute;
  right: 12px;
  bottom: 120px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.control-btn {
  background: rgba(0,0,0,0.5);
  padding: 12px;
  border-radius: 50%;
  color: #00e676;
}

/* BOTTOM BUTTON */
.bottom-bar {
  text-align: center;
}

.start-btn {
  background: linear-gradient(45deg, #00c853, #64dd17);
  padding: 15px 35px;
  border-radius: 30px;
  font-size: 18px;
  border: none;
  color: white;
  box-shadow: 0 0 15px rgba(0,255,100,0.6);
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<!-- BORDER FRAME -->
<div class="camera-frame"></div>

<div class="overlay">

  <!-- TOP -->
  <div>
    <div id="poseName" class="pose-title">Ready?</div>
    <div id="countdown" class="countdown"></div>
  </div>

  <!-- SIDE -->
  <div class="side-controls">
    <div class="control-btn" id="scoreDisplay">0</div>
    <div class="control-btn">
  <img src="logo.png" alt="App Logo" style="width:30px; height:30px;">
</div>
    <div class="control-btn">🏆</div>
  </div>

  <!-- BOTTOM -->
  <div class="bottom-bar">
    <button id="startBtn" class="start-btn">START</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
let video = document.getElementById("video");
let poseName = document.getElementById("poseName");
let countdownDisplay = document.getElementById("countdown");
let scoreDisplay = document.getElementById("scoreDisplay");
let startBtn = document.getElementById("startBtn");

let poses = [
  {name: "Mountain Pose"},
  {name: "Tree Pose"},
  {name: "Downward Dog"},
  {name: "Warrior I"},
  {name: "Warrior II"}
];

let index = 0;
let scores = [];

startBtn.onclick = async () => {
  startBtn.style.display = "none";
  if (!video.srcObject) await startCamera();
  startPose();
};

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }
    });
    video.srcObject = stream;
  } catch {
    alert("Camera denied.");
  }
}

function startPose() {
  if (index >= poses.length) return finish();

  poseName.innerText = poses[index].name;
  let prep = 3;
  countdownDisplay.innerText = prep;

  let prepTimer = setInterval(() => {
    prep--;
    if (prep > 0) countdownDisplay.innerText = prep;
    else if (prep === 0) countdownDisplay.innerText = "GO!";
    else {
      clearInterval(prepTimer);
      holdPose();
    }
  }, 1000);
}

function holdPose() {
  let time = 5;
  let score = 60;

  let timer = setInterval(() => {
    time--;
    score += Math.random() * 5;
    if (score > 100) score = 100;

    countdownDisplay.innerText = time;
    scoreDisplay.innerText = Math.round(score);

    if (time <= 0) {
      clearInterval(timer);
      scores.push(score);
      index++;
      setTimeout(startPose, 1500);
    }
  }, 1000);
}

function finish() {
  let avg = Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);

  poseName.innerText = "Completed!";
  countdownDisplay.innerText = avg;

  confetti();

  setTimeout(() => {
    alert("Final Score: " + avg);
    location.reload();
  }, 2000);
}
</script>

</body>
</html>
